services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RaceDay_Pass123"
    ports:
      - "1433:1433"

  api:
    build: ./Part2/RaceDay.Api
    environment:
      ConnectionStrings__RaceDayDb: "Server=db;Database=RaceDayApiDB;User Id=sa;Password=RaceDay_Pass123;TrustServerCertificate=True;"
      RunMigrations: "true"
    ports:
      - "5149:8080"
    depends_on:
      - db

  web:
    build: ./Part3/RaceDay.Web
    environment:
      ApiBaseUrl: "http://api:8080"
    ports:
      - "5101:8080"
    depends_on:
      - api