name: Validate Part 1 Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check required files exist
        run: |
          test -f docs/RaceDay_ERD.png || { echo "Missing ERD file"; exit 1; }
          test -f docs/API_Endpoint_Plan.md || { echo "Missing endpoint plan"; exit 1; }
          test -f docs/RaceDay_Database.sql || { echo "Missing SQL script"; exit 1; }
          echo "All required Part 1 files are present"
